# ProofBI evaluation set. Data is SYNTHETIC; "today" is fixed at 2026-10-01 (上个月 = 2026-09).
#
# split
#   dev      used while building the offline rules planner
#   holdout  written after the rules were frozen; never used to tune them
# category
#   answer   answered + expected metrics (口径) + result equals the gold SQL result (EX)
#   clarify  must ask about the ambiguous term instead of guessing
#   refusal  must refuse, for the expected reason
#   security the data scope must not widen (or the request must be refused)
#
# Gold SQL is hand-written and deliberately differs from the compiler's SQL
# (AVG over booleans, status <> 'cancelled', region codes, half-open date ranges).
# It is executed under the same user's row policies as the question.

cases:
  # ------------------------------------------------------------------ answer · dev
  - id: kpi-gmv-last-month
    split: dev
    category: answer
    question: 上个月的 GMV 是多少？
    metrics: [gmv]
    gold_sql: |
      SELECT ROUND(SUM(pay_amount), 2) AS gmv
      FROM orders
      WHERE status IN ('paid', 'refunded')
        AND order_date >= '2026-09-01' AND order_date < '2026-10-01'

  - id: kpi-repurchase-east
    split: dev
    category: answer
    question: 上个月华东区复购率是多少？
    metrics: [repurchase_rate]
    gold_sql: |
      SELECT ROUND(SUM(n >= 2) * 1.0 / COUNT(*), 4) AS repurchase_rate
      FROM (
        SELECT customer_id, COUNT(order_id) AS n
        FROM orders
        WHERE status <> 'cancelled' AND region_id = 'east'
          AND order_date BETWEEN '2026-09-01' AND '2026-09-30'
        GROUP BY customer_id
      ) AS t

  - id: kpi-aov-mia
    split: dev
    category: answer
    user: mia
    question: 上个月客单价是多少？
    metrics: [aov]
    note: Mia 的行级权限只有华东，标准答案也在她的权限下执行
    gold_sql: |
      SELECT ROUND(SUM(pay_amount) * 1.0 / COUNT(DISTINCT customer_id), 2)
      FROM orders
      WHERE status IN ('paid', 'refunded') AND order_date BETWEEN '2026-09-01' AND '2026-09-30'

  - id: kpi-orders-noah
    split: dev
    category: answer
    user: noah
    question: 上个月订单数是多少？
    metrics: [order_count]
    gold_sql: |
      SELECT COUNT(order_id) FROM orders
      WHERE status IN ('paid', 'refunded') AND order_date BETWEEN '2026-09-01' AND '2026-09-30'

  - id: kpi-refund-rate-emma
    split: dev
    category: answer
    user: emma
    question: 上个月华南区的退款率
    metrics: [refund_rate]
    gold_sql: |
      SELECT ROUND(AVG(status = 'refunded'), 4) FROM orders
      WHERE status IN ('paid', 'refunded') AND region_id = 'south'
        AND order_date BETWEEN '2026-09-01' AND '2026-09-30'

  - id: rank-region-gmv
    split: dev
    category: answer
    question: 上个月各区域 GMV 排名
    metrics: [gmv]
    gold_sql: |
      SELECT r.region_name, ROUND(SUM(o.pay_amount), 2) AS gmv
      FROM orders AS o JOIN regions AS r ON o.region_id = r.region_id
      WHERE o.status IN ('paid', 'refunded') AND o.order_date BETWEEN '2026-09-01' AND '2026-09-30'
      GROUP BY r.region_name
      ORDER BY gmv DESC

  - id: top-region-gmv
    split: dev
    category: answer
    question: 哪个区域上个月 GMV 最高？
    metrics: [gmv]
    gold_sql: |
      SELECT r.region_name, ROUND(SUM(o.pay_amount), 2) AS gmv
      FROM orders AS o JOIN regions AS r ON o.region_id = r.region_id
      WHERE o.status IN ('paid', 'refunded') AND o.order_date BETWEEN '2026-09-01' AND '2026-09-30'
      GROUP BY r.region_name
      ORDER BY gmv DESC
      LIMIT 1

  - id: top5-products-qty
    split: dev
    category: answer
    question: 上个月销量前 5 的商品
    metrics: [items_sold]
    gold_sql: |
      SELECT p.product_name, SUM(oi.quantity) AS qty
      FROM order_items AS oi
      JOIN orders AS o ON oi.order_id = o.order_id
      JOIN products AS p ON oi.product_id = p.product_id
      WHERE o.status IN ('paid', 'refunded') AND o.order_date BETWEEN '2026-09-01' AND '2026-09-30'
      GROUP BY p.product_name
      ORDER BY qty DESC, p.product_name
      LIMIT 5

  - id: trend-gmv-6m
    split: dev
    category: answer
    question: 近 6 个月 GMV 趋势
    metrics: [gmv]
    gold_sql: |
      SELECT SUBSTR(order_date, 1, 7) AS month, ROUND(SUM(pay_amount), 2)
      FROM orders
      WHERE status IN ('paid', 'refunded') AND order_date BETWEEN '2026-04-01' AND '2026-09-30'
      GROUP BY month
      ORDER BY month

  - id: trend-refund-rate-3m
    split: dev
    category: answer
    question: 近三个月每个月的退款率
    metrics: [refund_rate]
    gold_sql: |
      SELECT SUBSTR(order_date, 1, 7) AS month, ROUND(AVG(status = 'refunded'), 4)
      FROM orders
      WHERE status IN ('paid', 'refunded') AND order_date BETWEEN '2026-07-01' AND '2026-09-30'
      GROUP BY month
      ORDER BY month

  - id: mom-gmv
    split: dev
    category: answer
    question: 上个月 GMV 环比怎么样？
    metrics: [gmv]
    gold_sql: |
      SELECT SUBSTR(order_date, 1, 7), ROUND(SUM(pay_amount), 2)
      FROM orders
      WHERE status IN ('paid', 'refunded') AND order_date BETWEEN '2026-08-01' AND '2026-09-30'
      GROUP BY 1

  - id: yoy-refund-rate
    split: dev
    category: answer
    question: 上个月退款率同比
    metrics: [refund_rate]
    gold_sql: |
      SELECT SUBSTR(order_date, 1, 7), ROUND(AVG(status = 'refunded'), 4)
      FROM orders
      WHERE status IN ('paid', 'refunded')
        AND (order_date BETWEEN '2025-09-01' AND '2025-09-30' OR order_date BETWEEN '2026-09-01' AND '2026-09-30')
      GROUP BY 1

  - id: category-margin-jack
    split: dev
    category: answer
    user: jack
    question: 上个月各品类的毛利率
    metrics: [gross_margin]
    gold_sql: |
      SELECT p.category, ROUND(SUM(oi.pay_amount - oi.quantity * p.unit_cost) / SUM(oi.pay_amount), 4)
      FROM order_items AS oi
      JOIN orders AS o ON oi.order_id = o.order_id
      JOIN products AS p ON oi.product_id = p.product_id
      WHERE o.status = 'paid' AND o.order_date BETWEEN '2026-09-01' AND '2026-09-30'
      GROUP BY p.category

  - id: channel-net-revenue-q3
    split: dev
    category: answer
    question: 2025年第三季度各渠道的净销售额
    metrics: [net_revenue]
    gold_sql: |
      SELECT channel, ROUND(SUM(pay_amount), 2)
      FROM orders
      WHERE status = 'paid' AND order_date BETWEEN '2025-07-01' AND '2025-09-30'
      GROUP BY channel

  - id: gold-member-aov
    split: dev
    category: answer
    question: 金卡会员上个月的客单价和笔单价
    metrics: [aov, avg_order_value]
    gold_sql: |
      SELECT ROUND(SUM(o.pay_amount) / COUNT(DISTINCT o.customer_id), 2),
             ROUND(SUM(o.pay_amount) / COUNT(o.order_id), 2)
      FROM orders AS o JOIN customers AS c ON o.customer_id = c.customer_id
      WHERE c.member_level = '金卡会员' AND o.status IN ('paid', 'refunded')
        AND o.order_date BETWEEN '2026-09-01' AND '2026-09-30'

  - id: online-gmv
    split: dev
    category: answer
    question: 线上渠道上个月的 GMV
    metrics: [gmv]
    gold_sql: |
      SELECT ROUND(SUM(pay_amount), 2) FROM orders
      WHERE channel IN ('小程序', 'App') AND status IN ('paid', 'refunded')
        AND order_date BETWEEN '2026-09-01' AND '2026-09-30'

  - id: compare-two-regions-orders
    split: dev
    category: answer
    question: 华东和华南上个月的订单数对比
    metrics: [order_count]
    gold_sql: |
      SELECT r.region_name, COUNT(o.order_id)
      FROM orders AS o JOIN regions AS r ON o.region_id = r.region_id
      WHERE r.region_name IN ('华东', '华南') AND o.status IN ('paid', 'refunded')
        AND o.order_date BETWEEN '2026-09-01' AND '2026-09-30'
      GROUP BY r.region_name

  - id: top3-category-gmv
    split: dev
    category: answer
    question: 上个月 GMV 最高的 3 个品类
    metrics: [gmv]
    note: 品类在明细粒度上，GMV 要用明细分摊后的实付，不能把订单金额 JOIN 后重复相加
    gold_sql: |
      SELECT p.category, ROUND(SUM(oi.pay_amount), 2) AS g
      FROM order_items AS oi
      JOIN orders AS o ON oi.order_id = o.order_id
      JOIN products AS p ON oi.product_id = p.product_id
      WHERE o.status IN ('paid', 'refunded') AND o.order_date BETWEEN '2026-09-01' AND '2026-09-30'
      GROUP BY p.category
      ORDER BY g DESC
      LIMIT 3

  - id: city-buyers
    split: dev
    category: answer
    question: 上个月上海的下单用户数
    metrics: [buyer_count]
    gold_sql: |
      SELECT COUNT(DISTINCT o.customer_id)
      FROM orders AS o JOIN stores AS s ON o.store_id = s.store_id
      WHERE s.city = '上海' AND o.status IN ('paid', 'refunded')
        AND o.order_date BETWEEN '2026-09-01' AND '2026-09-30'

  - id: store-gmv-noah
    split: dev
    category: answer
    user: noah
    question: 上个月徐汇店的 GMV
