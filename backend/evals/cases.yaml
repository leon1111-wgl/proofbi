    metrics: [repurchase_rate]
    note: 追问沿用上一问的指标和时间，只替换区域
    gold_sql: |
      SELECT ROUND(SUM(n >= 2) * 1.0 / COUNT(*), 4)
      FROM (
        SELECT customer_id, COUNT(order_id) AS n
        FROM orders
        WHERE status <> 'cancelled' AND region_id = 'south'
          AND order_date BETWEEN '2026-09-01' AND '2026-09-30'
        GROUP BY customer_id
      ) AS t

  - id: self-correct-sql-error
    split: dev
    category: answer
    question: 上个月的 GMV 是多少？
    fault: sql_error
    metrics: [gmv]
    note: 第一次生成的 SQL 引用了不存在的字段，执行报错后交回模型自我纠错
    gold_sql: |
      SELECT ROUND(SUM(pay_amount), 2) FROM orders
      WHERE status IN ('paid', 'refunded') AND order_date BETWEEN '2026-09-01' AND '2026-09-30'

  - id: self-correct-caliber
    split: dev
    category: answer
    question: 上个月华东区的 GMV
    fault: caliber_drift
    metrics: [gmv]
    note: 第一次生成的 SQL 漏掉状态过滤（会把已取消订单算进 GMV），口径校验拦下后纠正
    gold_sql: |
      SELECT ROUND(SUM(pay_amount), 2) FROM orders
      WHERE region_id = 'east' AND status IN ('paid', 'refunded')
        AND order_date BETWEEN '2026-09-01' AND '2026-09-30'

  - id: clarified-net-revenue
    split: dev
    category: answer
    question: 上个月销售额是多少？
    clarifications: {销售额: net_revenue}
    metrics: [net_revenue]
    note: 用户澄清“销售额”指净销售额之后的回答
    gold_sql: |
      SELECT ROUND(SUM(pay_amount - refund_amount), 2) FROM orders
      WHERE status IN ('paid', 'refunded') AND order_date BETWEEN '2026-09-01' AND '2026-09-30'

  # ------------------------------------------------------------------ clarify · dev
  - id: clarify-sales
    split: dev
