[project]
name = "proofbi"
version = "1.0.0"
description = "可核对的 ChatBI：答案中的每个数字都能点开看到对应的 SQL、执行信息和结果行"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "PyJWT>=2.8",
    "PyYAML>=6.0",
    "sqlglot>=30.0,<31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
